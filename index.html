<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xflow · 漫剧制作与资产管理平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-0: #080614;
        --bg-1: #0E0A1C;
        --bg-2: #150F28;
        --border: rgba(167,139,250,0.16);
        --border-strong: rgba(167,139,250,0.32);
        --text-0: #ECE9F7;
        --text-1: #B8A5F5;
        --text-2: #8B7EC8;
        --text-3: #5F5490;
        --primary: #A78BFA;
        --primary-strong: #7C3AED;
        --primary-glow: rgba(139,92,246,0.55);
        --warm: #F9A8D4;
        --gold: #FCD34D;
        --font-latin: "Plus Jakarta Sans","SF Pro Display",-apple-system,sans-serif;
        --font-cjk: "HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: var(--bg-0);
        color: var(--text-0);
        font-family: var(--font-cjk);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }

      /* ── Atmospheric layers ──────────────────────────────────── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 80% 55% at 50% 40%, rgba(109,40,217,0.22) 0%, transparent 65%),
          radial-gradient(ellipse 55% 40% at 10% 8%, rgba(139,92,246,0.16), transparent 60%),
          radial-gradient(ellipse 45% 35% at 92% 88%, rgba(249,168,212,0.10), transparent 55%);
      }

      /* ── Nav ─────────────────────────────────────────────────── */
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 36px;
        background: rgba(8,6,20,0.70);
        backdrop-filter: saturate(180%) blur(24px);
        -webkit-backdrop-filter: saturate(180%) blur(24px);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        font-family: var(--font-latin);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-decoration: none;
        background: linear-gradient(135deg, #DDD6FE 0%, #C4B5FD 50%, var(--warm) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        transition: filter 0.18s;
      }
      .brand:hover { filter: brightness(1.12); }

      .auth-area {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
        z-index: 1;
      }

      /* pill button */
      .pill-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 20px;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: rgba(167,139,250,0.10);
        font-family: var(--font-cjk);
        font-size: 14px;
        font-weight: 600;
        color: var(--text-0);
        cursor: pointer;
        transition: background 0.18s, box-shadow 0.18s, transform 0.18s;
        text-decoration: none;
        white-space: nowrap;
        backdrop-filter: blur(8px);
      }
      .pill-btn:hover {
        background: rgba(167,139,250,0.20);
        box-shadow: 0 4px 20px rgba(167,139,250,0.25);
        transform: translateY(-1px);
      }

      /* user trigger */
      .user-trigger {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px 6px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(167,139,250,0.07);
        cursor: pointer;
        font-family: var(--font-cjk);
        font-size: 14px;
        color: var(--text-0);
        transition: background 0.18s, border-color 0.18s;
        backdrop-filter: blur(8px);
      }
      .user-trigger:hover {
        background: rgba(167,139,250,0.14);
        border-color: var(--border-strong);
      }

      .avatar {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-strong), var(--warm));
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      /* dropdown */
      .dropdown {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        min-width: 188px;
        background: rgba(18,12,34,0.94);
        backdrop-filter: blur(28px) saturate(200%);
        -webkit-backdrop-filter: blur(28px) saturate(200%);
        border: 1px solid var(--border-strong);
        border-radius: 16px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.5), 0 0 30px rgba(139,92,246,0.18);
        overflow: hidden;
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
        pointer-events: none;
        transition: opacity 0.18s cubic-bezier(.2,.8,.2,1), transform 0.18s cubic-bezier(.2,.8,.2,1);
      }
      .dropdown.open {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .dropdown-item {
        display: block;
        width: 100%;
        padding: 12px 18px;
        font-family: var(--font-cjk);
        font-size: 14px;
        font-weight: 400;
        color: var(--text-0);
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        text-align: left;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.12s, color 0.12s;
      }
      .dropdown-item:last-child { border-bottom: none; }
      .dropdown-item:hover { background: rgba(167,139,250,0.10); color: var(--primary); }
      .dropdown-item.danger { color: #F87171; }
      .dropdown-item.danger:hover { background: rgba(248,113,113,0.10); color: #FCA5A5; }

      /* ── Hero ────────────────────────────────────────────────── */
      .hero {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 64px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 100px;
        text-align: center;
        overflow: hidden;
      }

      /* Central glow orb — like Reflect */
      .glow-orb {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -45%);
        width: min(72vw, 560px);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: radial-gradient(circle at center,
          rgba(167,139,250,0.70) 0%,
          rgba(124,58,237,0.45) 30%,
          rgba(109,40,217,0.20) 55%,
          transparent 72%
        );
        filter: blur(48px);
        z-index: 0;
        pointer-events: none;
        animation: orbPulse 6s ease-in-out infinite;
      }

      @keyframes orbPulse {
        0%, 100% { opacity: 0.85; transform: translate(-50%,-45%) scale(1); }
        50%       { opacity: 1;    transform: translate(-50%,-45%) scale(1.06); }
      }

      /* warm inner ring (温馨感) */
      .glow-orb-inner {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -45%);
        width: min(32vw, 240px);
        aspect-ratio: 1/1;
        border-radius: 50%;
        background: radial-gradient(circle,
          rgba(249,168,212,0.45) 0%,
          rgba(167,139,250,0.22) 50%,
          transparent 75%
        );
        filter: blur(28px);
        z-index: 0;
        pointer-events: none;
        animation: orbPulse 4.5s ease-in-out infinite reverse;
      }

      /* text layers */
      .eyebrow {
        position: relative; z-index: 1;
        font-family: var(--font-cjk);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--warm);
        margin-bottom: 28px;
        opacity: 0;
        transform: translateY(16px);
        animation: fadeUp 0.65s cubic-bezier(.2,.8,.2,1) 0.08s forwards;
      }
      .eyebrow::before { content: "❀  "; opacity: 0.7; }
      .eyebrow::after  { content: "  ❀"; opacity: 0.7; }

      .title {
        position: relative; z-index: 1;
        font-family: var(--font-latin);
        font-size: clamp(48px, 7.5vw, 108px);
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.04;
        color: var(--text-0);
        margin-bottom: 26px;
        opacity: 0;
        transform: translateY(22px);
        animation: fadeUp 0.65s cubic-bezier(.2,.8,.2,1) 0.20s forwards;
      }
      .title span {
        background: linear-gradient(135deg, #DDD6FE 0%, #C4B5FD 40%, var(--warm) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        position: relative; z-index: 1;
        font-size: clamp(15px, 1.8vw, 19px);
        font-weight: 400;
        line-height: 1.70;
        color: var(--text-1);
        max-width: 560px;
        margin-bottom: 50px;
        opacity: 0;
        transform: translateY(16px);
        animation: fadeUp 0.65s cubic-bezier(.2,.8,.2,1) 0.33s forwards;
      }

      .cta {
        position: relative; z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 16px 36px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary-strong) 0%, var(--primary) 60%, var(--warm) 140%);
        color: #fff;
        font-family: var(--font-cjk);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-decoration: none;
        box-shadow: 0 6px 28px rgba(124,58,237,0.45), 0 2px 8px rgba(249,168,212,0.20);
        transition: transform 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.22s cubic-bezier(.2,.8,.2,1);
        opacity: 0;
        transform: translateY(16px);
        animation: fadeUp 0.65s cubic-bezier(.2,.8,.2,1) 0.46s forwards;
      }
      .cta:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 16px 44px rgba(124,58,237,0.55), 0 4px 16px rgba(249,168,212,0.30);
      }
      .cta .cta-icon {
        font-size: 18px;
        line-height: 1;
        transition: transform 0.22s;
      }
      .cta:hover .cta-icon { transform: translateX(4px); }

      @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
      }

      /* ── Footer / copyright ──────────────────────────────────── */
      .copyright {
        position: fixed;
        left: 28px;
        bottom: 22px;
        font-size: 12px;
        color: var(--text-3);
        letter-spacing: 0.01em;
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        animation: fadeUp 0.55s cubic-bezier(.2,.8,.2,1) 0.62s forwards;
      }

      /* ── Sparkle particles ───────────────────────────────────── */
      .sparkle {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        animation: twinkle linear infinite;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.08; transform: scale(0.6); }
        50%       { opacity: 0.90; transform: scale(1.3); }
      }

      /* ── Cherry blossom petals ───────────────────────────────── */
      .petal {
        position: fixed;
        top: -40px;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
        animation: petalFall linear infinite;
      }
      @keyframes petalFall {
        0%   { opacity: 0;    transform: translateY(0)      translateX(0)    rotate(0deg); }
        5%   { opacity: 0.65; }
        90%  { opacity: 0.50; }
        100% { opacity: 0;    transform: translateY(110vh) translateX(60px) rotate(600deg); }
      }

      /* ── Mobile ──────────────────────────────────────────────── */
      @media (max-width: 640px) {
        .nav { padding: 0 20px; }
        .hero { padding: 0 20px 80px; }
        .phone-mask { display: none; }
        .copyright {
          position: static;
          display: block;
          text-align: center;
          padding: 0 0 32px;
          opacity: 1;
          animation: none;
        }
      }
    </style>
  </head>
  <body>

    <header class="nav">
      <a href="/" class="brand">Xflow</a>
      <div id="authArea" class="auth-area"></div>
    </header>

    <main class="hero">
      <!-- atmospheric orbs -->
      <div class="glow-orb" aria-hidden="true"></div>
      <div class="glow-orb-inner" aria-hidden="true"></div>

      <p class="eyebrow">轻量化 · 漫剧制作与资产管理平台</p>
      <h1 class="title">让漫剧制作变简单</h1>
      <p class="subtitle">从小说拆解、章节大纲到分镜与图像资产<br>一个工作台完成全流程漫剧创作。</p>
      <a href="/workspace.html" class="cta">
        进入工作台
        <span class="cta-icon">✦</span>
      </a>
    </main>

    <footer class="copyright">© 2026 Xflow漫剧平台. 保留所有权利.</footer>

    <script>
      /* ── Auth area ────────────────────────────────────────── */
      (function () {
        const authArea = document.getElementById("authArea");

        function maskPhone(p) {
          if (!p || p.length < 7) return p || "";
          return p.slice(0, 3) + "****" + p.slice(-4);
        }
        function initial(p) { return p ? p.slice(0, 1) : "?"; }

        function renderLoggedOut() {
          authArea.innerHTML = "";
          const btn = document.createElement("button");
          btn.className = "pill-btn";
          btn.textContent = "登录";
          btn.onclick = () => { window.location.href = "/login.html"; };
          authArea.appendChild(btn);
        }

        function renderLoggedIn(user) {
          authArea.innerHTML = "";
          const trigger = document.createElement("button");
          trigger.className = "user-trigger";
          trigger.setAttribute("aria-haspopup", "true");
          trigger.setAttribute("aria-expanded", "false");

          const av = document.createElement("span");
          av.className = "avatar";
          av.textContent = initial(user.phone);

          const ph = document.createElement("span");
          ph.className = "phone-mask";
          ph.textContent = maskPhone(user.phone);

          trigger.appendChild(av);
          trigger.appendChild(ph);

          const menu = document.createElement("div");
          menu.className = "dropdown";
          menu.setAttribute("role", "menu");

          function menuItem(label, href, danger) {
            const el = document.createElement(href ? "a" : "button");
            el.className = "dropdown-item" + (danger ? " danger" : "");
            el.textContent = label;
            if (href) el.href = href;
            else el.type = "button";
            return el;
          }

          menu.appendChild(menuItem("✦ 进入工作台", "/workspace.html"));
          menu.appendChild(menuItem("充值积分", "/recharge.html"));
          if (user.isAdmin) menu.appendChild(menuItem("管理后台", "/admin.html"));

          const logoutBtn = menuItem("退出登录", null, true);
          logoutBtn.onclick = async () => {
            try { await fetch("/api/auth/logout", { method: "POST", credentials: "include" }); } catch (_) {}
            window.location.reload();
          };
          menu.appendChild(logoutBtn);

          authArea.appendChild(trigger);
          authArea.appendChild(menu);

          let open = false;
          trigger.onclick = (e) => {
            e.stopPropagation();
            open = !open;
            menu.classList.toggle("open", open);
            trigger.setAttribute("aria-expanded", String(open));
          };
          document.addEventListener("click", () => {
            if (open) { open = false; menu.classList.remove("open"); trigger.setAttribute("aria-expanded","false"); }
          }, { capture: true });
        }

        fetch("/api/auth/me", { credentials: "include" })
          .then(r => r.ok ? r.json() : null)
          .then(d => d?.user ? renderLoggedIn(d.user) : renderLoggedOut())
          .catch(() => renderLoggedOut());
      })();

      /* ── Sparkle particles ──────────────────────────────────── */
      (function () {
        const sparkleConfig = [
          { color: "rgba(167,139,250,1)", size: 2 },
          { color: "rgba(249,168,212,1)", size: 1.5 },
          { color: "rgba(255,255,255,1)",  size: 1 },
          { color: "rgba(196,181,253,1)", size: 2.5 },
          { color: "rgba(252,211,77,1)",  size: 1.5 },
        ];
        const count = 30;
        for (let i = 0; i < count; i++) {
          const cfg = sparkleConfig[i % sparkleConfig.length];
          const el = document.createElement("div");
          el.className = "sparkle";
          const s = cfg.size * (0.7 + Math.random() * 0.8);
          el.style.cssText = [
            `width:${s}px`, `height:${s}px`,
            `left:${Math.random() * 100}vw`,
            `top:${Math.random() * 100}vh`,
            `background:${cfg.color}`,
            `box-shadow:0 0 ${s * 3}px ${cfg.color}`,
            `animation-duration:${2.5 + Math.random() * 5}s`,
            `animation-delay:${-Math.random() * 5}s`,
          ].join(";");
          document.body.appendChild(el);
        }
      })();

      /* ── Cherry blossom petals ──────────────────────────────── */
      (function () {
        const petalSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="20" height="20">
          <g opacity="0.75">
            <ellipse cx="20" cy="10" rx="7" ry="11" fill="#F9A8D4" transform="rotate(0 20 20)"/>
            <ellipse cx="20" cy="10" rx="7" ry="11" fill="#F9A8D4" transform="rotate(72 20 20)"/>
            <ellipse cx="20" cy="10" rx="7" ry="11" fill="#FBCFE8" transform="rotate(144 20 20)"/>
            <ellipse cx="20" cy="10" rx="7" ry="11" fill="#F9A8D4" transform="rotate(216 20 20)"/>
            <ellipse cx="20" cy="10" rx="7" ry="11" fill="#FBCFE8" transform="rotate(288 20 20)"/>
            <circle cx="20" cy="20" r="3.5" fill="#FDE68A"/>
          </g>
        </svg>`;
        const petalB64 = "data:image/svg+xml;base64," + btoa(petalSvg);

        for (let i = 0; i < 6; i++) {
          const el = document.createElement("img");
          el.className = "petal";
          el.src = petalB64;
          el.setAttribute("aria-hidden", "true");
          const sz = 16 + Math.random() * 16;
          el.style.cssText = [
            `width:${sz}px`, `height:${sz}px`,
            `left:${5 + Math.random() * 90}vw`,
            `animation-duration:${16 + Math.random() * 14}s`,
            `animation-delay:${-Math.random() * 18}s`,
          ].join(";");
          document.body.appendChild(el);
        }
      })();
    </script>

  </body>
</html>
